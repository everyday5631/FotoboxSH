name: Webseite (GitHub Pages)

# Baut die Dokumentations-Seite aus README.md und docs/ (tools/build_site.py) und veröffentlicht sie.
# - Pull Request: nur bauen (prüft u. a., ob jede Seite eine gültige Kategorie hat), nichts veröffentlichen.
# - Push auf main (also nach dem Merge): bauen und veröffentlichen.
# Einmalig nötig: Settings → Pages → Build and deployment → Source: «GitHub Actions». Siehe docs/ENTWICKLUNG.md.
on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "docs/**"
      - "tools/build_site.py"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "README.md"
      - "docs/**"
      - "tools/build_site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install markdown-it-py
      - name: Seite bauen (bricht bei fehlender oder unbekannter Kategorie ab)
        run: python tools/build_site.py _site
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
