name: Build APK

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug
        env:
          # Bei Pull-Requests ist GITHUB_SHA ein automatischer Merge-Commit; der echte Commit steht im Head.
          APP_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: APK pruefen (Signatur, Paketname, Mindest-Android)
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$BT/apksigner" verify --verbose "$APK"
          "$BT/aapt2" dump badging "$APK" | grep -E "^package|sdkVersion|targetSdkVersion|launchable-activity"
          cp "$APK" Sonnhalde-Fotobox-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: fotobox-debug-apk
          path: Sonnhalde-Fotobox-debug.apk

      # Direkt installierbare APK (kein ZIP) als Vorab-Release, nur bei Push auf diesen Branch.
      - name: Als Release «dev-build» bereitstellen
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dev-build --cleanup-tag --yes || true
          gh release create dev-build Sonnhalde-Fotobox-debug.apk \
            --prerelease --target "$GITHUB_SHA" \
            --title "Dev-Build ($(git rev-parse --short HEAD))" \
            --notes "Automatischer Debug-Build. APK direkt herunterladen und auf dem Tablet installieren."
